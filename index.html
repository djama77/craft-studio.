<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Craft Studio</title><style>body{margin:0;background:#101827;color:white;font:15px system-ui}header{padding:16px;background:#1c2940;font-weight:700}main{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:18px}aside{display:grid;align-content:start;gap:10px}button,input,select{padding:10px;border:0;border-radius:8px}button{background:#4778f5;color:white;cursor:pointer}label{font-size:13px}canvas{background:white;max-width:100%;box-shadow:0 8px 30px #0006;touch-action:none}.stage{text-align:center;overflow:auto}@media(max-width:650px){main{grid-template-columns:1fr}aside{grid-template-columns:1fr 1fr}}</style><header>🎨 Craft Studio — DesignCraft + PhotoCraft</header><main><aside><label>Importer une photo<input type="file" id="file" accept="image/*"></label><button id="poster">Affiche A4</button><button id="square">Format carré</button><label>Luminosité <input id="bright" type="range" min="50" max="150" value="100"></label><label>Contraste <input id="contrast" type="range" min="50" max="150" value="100"></label><label>Saturation <input id="sat" type="range" min="0" max="200" value="100"></label><label>Texte<input id="txt" placeholder="Votre texte"></label><button id="add">Ajouter texte</button><button id="rect">Ajouter rectangle</button><label>Couleur<input type="color" id="color" value="#193f88"></label><button id="png">Exporter PNG</button><button id="reset">Réinitialiser</button></aside><div class="stage"><canvas id="c" width="800" height="800"></canvas><p>Déplacez les éléments avec le doigt ou la souris.</p></div></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let img=null,els=[],drag=null;const $=id=>document.getElementById(id);function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='white';x.fillRect(0,0,c.width,c.height);if(img){x.save();x.filter='brightness('+ $('bright').value+'%) contrast('+ $('contrast').value+'%) saturate('+ $('sat').value+'%)';let s=Math.max(c.width/img.width,c.height/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);x.restore()}for(const e of els){x.fillStyle=e.color;if(e.type==='text'){x.font='bold 45px system-ui';x.fillText(e.text,e.x,e.y)}else x.fillRect(e.x,e.y,200,90)}}$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const i=new Image;i.onload=()=>{img=i;URL.revokeObjectURL(url);draw()};i.src=url};$('poster').onclick=()=>{c.width=595;c.height=842;draw()};$('square').onclick=()=>{c.width=800;c.height=800;draw()};['bright','contrast','sat'].forEach(id=>$(id).oninput=draw);$('add').onclick=()=>{els.push({type:'text',text:$('txt').value||'Votre texte',x:70,y:120,color:$('color').value});draw()};$('rect').onclick=()=>{els.push({type:'rect',x:70,y:160,color:$('color').value});draw()};$('reset').onclick=()=>{img=null;els=[];['bright','contrast','sat'].forEach(id=>$(id).value=100);draw()};$('png').onclick=()=>{const a=document.createElement('a');a.download='craft-studio.png';a.href=c.toDataURL('image/png');a.click()};function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{const p=point(e);drag=[...els].reverse().find(v=>p.x>=v.x&&p.x<=v.x+(v.type==='rect'?200:Math.max(150,v.text.length*24))&&p.y>=v.y-(v.type==='text'?48:0)&&p.y<=v.y+(v.type==='rect'?90:12));if(drag){drag.dx=p.x-drag.x;drag.dy=p.y-drag.y;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(!drag)return;const p=point(e);drag.x=p.x-drag.dx;drag.y=p.y-drag.dy;draw()};c.onpointerup=()=>drag=null;draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
