<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Craft Studio V2</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1424;color:#edf2ff}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#18243a;gap:8px}header strong{font-size:18px}header small{color:#a9b8d0}.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 215px;gap:12px;padding:12px;min-height:calc(100vh - 65px)}aside{background:#18243a;padding:14px;border-radius:12px;display:flex;flex-direction:column;gap:9px;min-width:0}h3{margin:10px 0 3px;font-size:14px;color:#cbd7ed}button,input,select,textarea{font:inherit;border-radius:7px}button{border:0;background:#3458a9;color:white;padding:10px;cursor:pointer}button:hover{background:#466cc4}button.secondary{background:#293951}button.active{outline:2px solid #88b3ff}input:not([type=range]):not([type=color]),select,textarea{background:#0e192d;color:white;border:1px solid #40516a;padding:8px;max-width:100%;width:100%}input[type=range]{width:100%;accent-color:#7bafff}input[type=color]{height:35px;width:100%;border:0;background:none}label{font-size:12px;color:#b9c8e0}label span{float:right}.stage{display:flex;align-items:center;justify-content:center;overflow:auto;background:radial-gradient(circle,#26364d,#111b2b);border-radius:12px;padding:20px;min-height:500px}canvas{max-width:100%;max-height:75vh;box-shadow:0 12px 45px #0009;background:white;touch-action:none}.row{display:flex;gap:7px}.row>*{flex:1;min-width:0}.layer{display:flex;align-items:center;justify-content:space-between;gap:5px;background:#26364c;border-radius:7px;padding:7px;font-size:12px}.layer.selected{outline:2px solid #7ca8ff}.layer button{padding:4px 8px}.hint{color:#9caec9;font-size:12px}.file{display:block;background:#3458a9;padding:10px;border-radius:7px;text-align:center;color:white;cursor:pointer}.file input{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.stage{min-height:340px;order:-1;padding:12px}canvas{max-height:55vh}aside{gap:8px}header strong{font-size:15px}}
</style></head><body>
<header><div><strong>🎨 Craft Studio V2</strong><br><small>DesignCraft + PhotoCraft · éditeur web</small></div><button id="export">⬇ PNG</button></header>
<div class="layout"><aside>
<h3>Projet</h3><div class="row"><button id="poster">A4</button><button id="square">Carré</button><button id="story">Story</button></div>
<label class="file">📷 Importer une photo<input type="file" id="photo" accept="image/*"></label>
<div class="row"><button class="secondary" id="save">Sauver projet</button><label class="file" style="flex:1">Ouvrir JSON<input type="file" id="load" accept=".json,application/json"></label></div>
<h3>Modèles DesignCraft</h3><select id="template"><option value="">Page vierge</option><option value="poster">Affiche événement</option><option value="report">Couverture rapport</option><option value="social">Publication réseaux sociaux</option></select><button id="apply">Appliquer le modèle</button>
<h3>Retouche PhotoCraft</h3>
<label>Luminosité <span id="bv">100%</span><input type="range" id="brightness" min="0" max="200" value="100"></label>
<label>Contraste <span id="cv">100%</span><input type="range" id="contrast" min="0" max="200" value="100"></label>
<label>Saturation <span id="sv">100%</span><input type="range" id="saturation" min="0" max="200" value="100"></label>
<label>Flou <span id="fv">0px</span><input type="range" id="blur" min="0" max="15" value="0"></label>
<div class="row"><button class="secondary" id="gray">Noir et blanc</button><button class="secondary" id="resetfx">Effets zéro</button></div>
</aside><section class="stage"><canvas id="canvas" width="800" height="800" aria-label="Zone de création"></canvas></section>
<aside><h3>Éléments</h3><input id="text" placeholder="Votre titre ou texte"><div class="row"><button id="addtext">+ Texte</button><button id="addrect">+ Forme</button></div>
<label>Couleur<input type="color" id="color" value="#245ac5"></label><label>Taille texte<input id="fontsize" type="range" min="18" max="110" value="48"></label>
<h3>Calques</h3><div id="layers"></div><div class="row"><button class="secondary" id="up">↑ Monter</button><button class="secondary" id="down">↓ Descendre</button></div>
<div class="row"><button class="secondary" id="duplicate">Dupliquer</button><button class="secondary" id="delete">Supprimer</button></div>
<h3>Export</h3><div class="row"><button id="export2">PNG</button><button id="pdf">PDF / Imprimer</button></div><button class="secondary" id="clear">Nouveau projet</button>
<p class="hint">Touchez un élément sur la page pour le déplacer. Sélectionnez un calque pour modifier sa couleur ou sa taille. L'export PDF utilise l'impression du navigateur.</p></aside></div>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let items=[],selected=-1,image=null,imageData=null,drag=null,bg='#ffffff';const effects=['brightness','contrast','saturation','blur'];
function fit(){return image?Math.max(canvas.width/image.width,canvas.height/image.height):1}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);if(image){ctx.save();ctx.filter='brightness('+$('brightness').value+'%) contrast('+$('contrast').value+'%) saturate('+$('saturation').value+'%) blur('+$('blur').value+'px)';let z=fit(),w=image.width*z,h=image.height*z;ctx.drawImage(image,(canvas.width-w)/2,(canvas.height-h)/2,w,h);ctx.restore()}
items.forEach((a,i)=>{ctx.save();ctx.fillStyle=a.color;if(a.type==='text'){ctx.font='bold '+a.size+'px system-ui';ctx.textBaseline='top';a.w=ctx.measureText(a.text).width;a.h=a.size*1.3;ctx.fillText(a.text,a.x,a.y)}else{a.w=a.w||230;a.h=a.h||100;ctx.fillRect(a.x,a.y,a.w,a.h)}if(i===selected){ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;ctx.setLineDash([8,5]);ctx.strokeRect(a.x-5,a.y-5,a.w+10,a.h+10)}ctx.restore()})}
function layers(){const el=$('layers');el.innerHTML='';items.forEach((a,i)=>{let b=document.createElement('button');b.className='layer'+(i===selected?' selected':'');b.textContent=(a.type==='text'?'T ':'▣ ')+(a.text||'Rectangle')+' · '+(i+1);b.onclick=()=>select(i);el.prepend(b)})}
function select(i){selected=i;let a=items[i];if(a){$('color').value=a.color;if(a.type==='text'){$('fontsize').value=a.size;$('text').value=a.text}}layers();render()}
function add(a){items.push(a);select(items.length-1)}
$('addtext').onclick=()=>add({type:'text',text:$('text').value||'Votre texte',x:60,y:70,size:+$('fontsize').value,color:$('color').value});
$('addrect').onclick=()=>add({type:'rect',x:60,y:160,w:230,h:100,color:$('color').value});
$('text').onchange=()=>{if(items[selected]?.type==='text'){items[selected].text=$('text').value;layers();render()}};
$('color').oninput=()=>{if(items[selected]){items[selected].color=$('color').value;render()}};
$('fontsize').oninput=()=>{if(items[selected]?.type==='text'){items[selected].size=+$('fontsize').value;render()}};
function size(w,h){canvas.width=w;canvas.height=h;render()}
$('poster').onclick=()=>size(595,842);$('square').onclick=()=>size(800,800);$('story').onclick=()=>size(540,960);
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{image=im;imageData=src;render();resolve()};im.onerror=reject;im.src=src})}
$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>loadImage(r.result);r.readAsDataURL(f)};
effects.forEach((id,i)=>$(id).oninput=()=>{$(['bv','cv','sv','fv'][i]).textContent=$(id).value+(id==='blur'?'px':'%');render()});
$('gray').onclick=()=>{$('saturation').value=0;$('sv').textContent='0%';render()};
$('resetfx').onclick=()=>{effects.forEach((id,i)=>{$(id).value=id==='blur'?0:100;$(['bv','cv','sv','fv'][i]).textContent=$(id).value+(id==='blur'?'px':'%')});render()};
function move(d){if(selected<0)return;let j=selected+d;if(j<0||j>=items.length)return;[items[j],items[selected]]=[items[selected],items[j]];select(j)}
$('up').onclick=()=>move(1);$('down').onclick=()=>move(-1);
$('duplicate').onclick=()=>{if(selected>=0)add({...items[selected],x:items[selected].x+25,y:items[selected].y+25})};
$('delete').onclick=()=>{if(selected>=0){items.splice(selected,1);select(-1)}};
$('clear').onclick=()=>{if(confirm('Effacer ce projet ?')){items=[];image=null;imageData=null;bg='#fff';select(-1)}};
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.onpointerdown=e=>{let p=point(e);let i=-1;for(let j=items.length-1;j>=0;j--){let a=items[j];if(p.x>=a.x&&p.x<=a.x+a.w&&p.y>=a.y&&p.y<=a.y+a.h){i=j;break}}select(i);if(i>=0){drag={dx:p.x-items[i].x,dy:p.y-items[i].y};canvas.setPointerCapture(e.pointerId)}};
canvas.onpointermove=e=>{if(!drag||selected<0)return;let p=point(e);items[selected].x=p.x-drag.dx;items[selected].y=p.y-drag.dy;render()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function png(){let s=selected;selected=-1;render();canvas.toBlob(b=>{if(b)download(b,'craft-studio-v2.png');selected=s;render()},'image/png')}
$('export').onclick=$('export2').onclick=png;
$('pdf').onclick=()=>{let s=selected;selected=-1;render();let url=canvas.toDataURL('image/png'),w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres pop-up pour exporter en PDF.');selected=s;render();return}w.document.write('<title>Craft Studio PDF</title><style>body{margin:0}img{width:100%;height:auto}@media print{@page{margin:0}}</style><img src="'+url+'"><script>onload=()=>print()<\/script>');w.document.close();selected=s;render()};
$('save').onclick=()=>{let data={version:2,width:canvas.width,height:canvas.height,bg,items,imageData,effects:Object.fromEntries(effects.map(id=>[id,$(id).value]))};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'craft-studio-project.json')};
$('load').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.items))throw Error('Projet invalide');canvas.width=data.width||800;canvas.height=data.height||800;bg=data.bg||'#fff';items=data.items;selected=-1;for(let id of effects){$(id).value=data.effects?.[id]??(id==='blur'?0:100);$(id).oninput()}if(data.imageData)await loadImage(data.imageData);else{image=null;imageData=null}layers();render()}catch(err){alert('Impossible d’ouvrir ce projet : '+err.message)}};
$('apply').onclick=()=>{let t=$('template').value;items=[];image=null;imageData=null;bg=t==='poster'?'#132447':t==='report'?'#eaf0f7':t==='social'?'#342052':'#ffffff';if(t==='poster'){size(595,842);items=[{type:'text',text:'ÉVÉNEMENT',x:45,y:90,size:65,color:'#ffffff'},{type:'rect',x:45,y:210,w:460,h:8,color:'#ffce65'},{type:'text',text:'Date • Lieu',x:45,y:265,size:35,color:'#ffce65'}]}else if(t==='report'){size(595,842);items=[{type:'rect',x:0,y:0,w:595,h:180,color:'#1c4b80'},{type:'text',text:'RAPPORT',x:40,y:230,size:70,color:'#1c4b80'},{type:'text',text:'Titre du document',x:40,y:350,size:32,color:'#263950'}]}else if(t==='social'){size(800,800);items=[{type:'text',text:'VOTRE MESSAGE',x:45,y:130,size:65,color:'#ffffff'},{type:'rect',x:45,y:260,w:680,h:12,color:'#ffb84d'}]}select(-1)};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
